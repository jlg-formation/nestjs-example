id: nestjs-backend-3j-06-concept-crosscutting
type: concept
title: "Le code métier doit rester 'pur'"
subtitle: "Les préoccupations transverses se gèrent en périphérie"

layout:
  template: concept
  density: medium
  emphasis: balanced

visual:
  kind: icon
