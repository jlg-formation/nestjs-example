concept:
  definition: "Un middleware s'exécute avant d'atteindre le contrôleur. Il est parfait pour le logging et le filtrage générique."
  bullets:
    - "Accès à req/res (Express ou Fastify selon adapter)"
    - "Peut ajouter des headers (requestId)"
    - "Peut refuser tôt certaines requêtes"
    - "Doit rester simple et rapide"
  pitfalls:
    - "❌ Faire de la logique métier dans un middleware"
    - "❌ Logging trop verbeux (bruit)"

covers:
  - "Middlewares : logging et filtrage"

notes_formateur: |
  ## Déroulé (3 min)

  ### Points clés
  - Middleware = bon pour aspects HTTP bas niveau.
  - On garde le middleware stateless.

  ### Transition
  Exemple : logger minimal.

notes_stagiaire: |
  ## À retenir

  **Middleware** : avant la route.
  **Usages** : logging, filtrage, headers.
