  - On peut documenter l'auth par clé API.

  ### Transition
  Exemple de valeur : rendre visible le format de réponse.

notes_stagiaire: |
  ## À retenir

  **Setup** : `SwaggerModule.setup('api', ...)`.
  **Bonus** : déclarer `x-api-key` dans la doc.
