id: ch2-code-controller-get-post
type: code_example
title: "@Controller + @Get + @Post : le minimum"
subtitle: "Deux endpoints, une intention claire"
covers:
  - "Décorateurs @Controller, @Get, @Post"

layout:
  template: code_example
  density: medium
  emphasis: text

visual:
  kind: code_render
  source: none
  placement: full
  alt: "Code NestJS controller"

code:
  language: "ts"
  snippet: |
    import { Body, Controller, Get, Post } from "@nestjs/common";

    @Controller("soldes")
    export class SoldesController {
      @Get("ping")
      ping() {
        return { ok: true };
      }

      @Post("recharge")
      recharge(@Body() body: { amount: number }) {
        return { ok: true, amount: body.amount };
      }
    }
  callouts:
    - line: 3
      text: "@Controller définit le préfixe de route"
    - line: 5
      text: "@Get expose un endpoint de lecture"
    - line: 10
      text: "@Post lit le body (validation plus tard)"
  expected_output: "/soldes/ping → { ok: true }"

notes_formateur: |
  ## Déroulé (3 min)
  - Dire : on n'a pas encore de service, c'est juste pour comprendre.
  - Transition : la logique métier doit vivre dans un service.

notes_stagiaire: |
  ## À retenir
  Les décorateurs décrivent l'API.
  On va ensuite extraire la logique dans un service injectable.
