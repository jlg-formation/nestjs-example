notes_formateur: |
  ## Déroulé (1 min)

  ### Points clés à aborder
  - On vise du "propre" : responsabilités claires.
  - On garde SQL brut, mais organisé.

  ### Question
  "Sur vos projets, où naissent les bugs : validation, config, erreurs ?"

  ### Transition
  D'abord : service = logique métier + dépendances.

notes_stagiaire: |
  ## À retenir

  **À la fin de ce chapitre, vous saurez** :
  - Créer un service injectable
  - Configurer l'app via `.env`
  - Valider des DTO automatiquement
  - Avoir des erreurs cohérentes côté API
  - Ranger le SQL brut dans des repositories
