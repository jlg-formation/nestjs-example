id: nestjs-backend-3j-03-warning-env
type: warning
title: "⚠️ `.env` : attention aux secrets"

layout:
  template: warning
  density: low
  emphasis: visual

visual:
  kind: icon
  query: "warning lock security"
  source: local
  placement: left
  alt: "Alerte sécurité"

warning:
  danger: "Un fichier `.env` peut contenir des secrets et fuit facilement (Git, logs, captures écran)."
  consequences:
    - "Identifiants DB exposés"
    - "Clés API réutilisées en production"
    - "Intrusion / fuite de données"
  prevention: "Ignorer `.env` dans Git, utiliser un `.env.example`, et injecter les secrets via l'environnement en prod"
  real_case: "Un `.env` commité par erreur suffit à compromettre une base en quelques minutes"

covers:
  - "Variables d’environnement (.env)"

notes_formateur: |
  ## Déroulé (2 min)

  ### Points clés à aborder
  - `.env` = pratique en dev, dangereux s'il est partagé.
  - Montrer l'intérêt de `.env.example`.

  ### Question
  "Qui a déjà vu un secret commité par erreur ?"

  ### Transition
  Après la config, on sécurise l'entrée : validation des DTO.

notes_stagiaire: |
  ## À retenir

  **Risque** : `.env` peut contenir des secrets.

  **Bonnes pratiques** :
  - `.env` dans `.gitignore`
  - fournir `.env.example`
  - secrets en prod via l'environnement (CI/CD, vault)
