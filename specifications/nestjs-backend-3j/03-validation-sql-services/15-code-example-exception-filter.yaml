code:
  language: "ts"
  snippet: |
    import {
      ArgumentsHost,
      Catch,
      ExceptionFilter,
      HttpException,
      HttpStatus,
    } from '@nestjs/common';

    @Catch()
    export class ApiExceptionFilter implements ExceptionFilter {
      catch(exception: unknown, host: ArgumentsHost) {
        const ctx = host.switchToHttp();
        const response = ctx.getResponse();

        const status =
          exception instanceof HttpException
            ? exception.getStatus()
            : HttpStatus.INTERNAL_SERVER_ERROR;

        response.status(status).json({
          statusCode: status,
          message: status === 500 ? 'Internal error' : (exception as any).message,
          errorCode: status === 500 ? 'INTERNAL_ERROR' : 'BAD_REQUEST',
        });
      }
    }
  callouts:
    - line: 9
      text: "@Catch() intercepte toutes les exceptions"
    - line: 18
      text: "500 par défaut si exception inconnue"
    - line: 21
      text: "Réponse JSON stable pour le client"
  expected_output: "Toute erreur → JSON avec statusCode/message/errorCode"

