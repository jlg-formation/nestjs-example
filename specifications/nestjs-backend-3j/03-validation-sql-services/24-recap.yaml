takeaways:
  - "Services `@Injectable` = logique métier testable"
  - "`.env` + ConfigService = config sans hardcode"
  - "DTO + ValidationPipe = erreurs 400 claires"
  - "Exception Filter = format d'erreur stable"
  - "Repository = SQL brut organisé et réutilisable"

