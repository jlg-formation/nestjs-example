  - "Organisation du code avec des repositories SQL bruts"

notes_formateur: |
  ## Déroulé (2 min)

  ### Questions flash
  - "Où place-t-on la validation ?"
  - "Pourquoi un repository ?"

  ### Transition
  On passe au CRUD complet : plusieurs DTO, plusieurs tables, relations.

notes_stagiaire: |
  ## À retenir

  **Checklist endpoint** : DTO → validation → service → repository → erreurs.

  **But** : une API stable, lisible et maintenable.
