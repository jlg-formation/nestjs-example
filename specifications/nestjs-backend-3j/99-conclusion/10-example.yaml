notes_formateur: |
  ## Déroulé (3 min)

  ### Points clés
  - Montrer la séparation des responsabilités.
  - Expliquer : le repository renvoie des données brutes, le service décide.

  ### Question
  "Votre alerte : contrôleur trop gros ou service trop gros ?"

notes_stagiaire: |
  ## À retenir

  **Endpoint propre** :
  - Controller : adapter HTTP
  - Service : règles métier
  - Repository : SQL paramétré

  **Bonus** : tests plus simples.
