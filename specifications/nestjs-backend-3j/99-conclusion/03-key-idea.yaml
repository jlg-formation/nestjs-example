layout:
  template: key_idea
  density: low
  emphasis: visual

visual:
  kind: icon
  query: "architecture layers"
  source: local
  placement: left
  alt: "Icône architecture en couches"

covers:
  - "Structure : modules, contrôleurs, services"
  - "Injection de dépendances"

message: "Une API durable = une architecture qui rend le changement facile."

supporting_points:
  - "Le contrôleur parle HTTP, pas SQL"
  - "Le service porte les règles métier"
