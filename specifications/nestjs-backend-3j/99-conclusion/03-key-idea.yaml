notes_formateur: |
  ## Déroulé (2 min)

  ### Développement
  Insister : la séparation évite le copier-coller et facilite les tests.

  ### Question
  "Dans votre code actuel, où se mélange HTTP et SQL ?"

notes_stagiaire: |
  ## À retenir

  **Règle simple** :
  - Controller = HTTP
  - Service = métier
  - Repository = SQL

  **Effet** : code testable et maintenable.
