id: ch1-code-json-read
type: code_example
title: "Lire un fichier JSON proprement"
subtitle: "fs + try/catch + typage"
covers:
  - "Manipulation simple d’un fichier JSON"

layout:
  template: code_example
  density: medium
  emphasis: text

visual:
  kind: code_render
  source: none
  placement: full
  alt: "Exemple TypeScript lecture JSON"

code:
  language: "ts"
  snippet: |
    import { readFile } from "node:fs/promises";

    interface AppConfig {
      port: number;
    }

    async function loadConfig(path: string): Promise<AppConfig> {
      const raw = await readFile(path, "utf-8");
      const data = JSON.parse(raw) as AppConfig;
      return data;
    }
  callouts:
    - line: 1
      text: "fs/promises : API async"
    - line: 3
      text: "Interface : forme attendue"
    - line: 8
      text: "JSON.parse : peut lever une erreur"
  expected_output: "Charge un { port: number } depuis un fichier"

notes_formateur: |
  ## Déroulé (3 min)
