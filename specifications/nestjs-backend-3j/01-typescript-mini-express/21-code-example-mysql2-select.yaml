code:
  language: "ts"
  snippet: |
    import mysql from "mysql2/promise";

    const pool = mysql.createPool({
      host: "localhost",
      user: "root",
      database: "training",
    });

    export async function findClientById(id: number) {
      const [rows] = await pool.query(
        "SELECT id, name, balance FROM clients WHERE id = ?",
        [id]
      );
      return rows;
    }
  callouts:
    - line: 1
      text: "mysql2/promise : API async"
    - line: 9
      text: "Requête paramétrée : le ? protège contre l'injection"
    - line: 13
      text: "rows = résultat brut à mapper ensuite"
  expected_output: "Retourne les lignes correspondant à l'id"

