code:
  language: "ts"
  snippet: |
    import { Injectable, NotFoundException } from '@nestjs/common';

    @Injectable()
    export class RechargeService {
      constructor(private readonly repo: RechargeRepository) {}

      async recharge(dto: CreateRechargeDto): Promise<ClientDto> {
        const client = await this.repo.applyRecharge(dto.clientId, dto.amount);
        if (!client) throw new NotFoundException('Client not found');
        return client;
      }
    }
  callouts:
    - line: 3
      text: "Service injectable = testable"
    - line: 8
      text: "Orchestration : délègue au repository"
    - line: 9
      text: "Erreur métier/HTTP propre (404)"
  expected_output: "clientId inconnu → 404"

covers:
