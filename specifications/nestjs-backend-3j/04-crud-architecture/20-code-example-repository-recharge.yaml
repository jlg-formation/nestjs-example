code:
  language: "ts"
  snippet: |
    import { Injectable } from '@nestjs/common';

    @Injectable()
    export class RechargeRepository {
      constructor(private readonly db: any) {}

      async applyRecharge(clientId: string, amount: number): Promise<ClientDto | null> {
        await this.db.begin();
        try {
          await this.db.query(
            'INSERT INTO recharges (client_id, amount) VALUES (?, ?)',
            [clientId, amount],
          );
          const [result] = await this.db.query(
            'UPDATE clients SET balance = balance + ? WHERE id = ?',
            [amount, clientId],
          );
          if ((result as any).affectedRows !== 1) return null;
          const [rows] = await this.db.query(
            'SELECT id, name, balance FROM clients WHERE id = ?',
            [clientId],
          );
          await this.db.commit();
          return (rows as any[])[0] ?? null;
        } catch (e) {
          await this.db.rollback();
          throw e;
        }
      }
    }
  callouts:
    - line: 7
      text: "Transaction courte"
    - line: 19
      text: "On retourne un DTO de sortie (row mappée)"
  expected_output: "Client existant → DTO avec balance mise à jour"

