  ## Déroulé (1 min)

  ### Points clés
  - On vise une API stable : contrats, types, formats.
  - On assemble tout ce qu'on a vu : validation + SQL + erreurs.

  ### Transition
  D'abord : définir les DTOs (contrats d'entrée/sortie).

