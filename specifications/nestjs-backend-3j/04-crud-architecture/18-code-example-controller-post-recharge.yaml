  emphasis: text

visual:
  kind: code_render
  source: none
  placement: full
  alt: "Controller NestJS : recharge"

code:
  language: "ts"
  snippet: |
    import { Body, Controller, Post } from '@nestjs/common';

    @Controller()
    export class RechargeController {
      constructor(private readonly service: RechargeService) {}

      @Post('/recharge')
      async recharge(@Body() dto: CreateRechargeDto): Promise<ApiResponse<ClientDto>> {
        const client = await this.service.recharge(dto);
        return { data: client };
      }
    }
  callouts:
    - line: 4
      text: "Controller fin : délègue la logique"
    - line: 7
      text: "Route explicite (POST /recharge)"
    - line: 8
      text: "Réponse typée et standardisée"
  expected_output: "Réponse 200 : { data: { id, name, balance } }"

