code:
  language: "ts"
  snippet: |
    import { Controller, Get, NotFoundException, Param } from '@nestjs/common';

    export class ClientBalanceDto {
      clientId!: string;
      balance!: number;
    }

    @Controller()
    export class ClientController {
      constructor(private readonly repo: ClientRepository) {}

      @Get('/clients/:id/soldes')
      async soldes(@Param('id') id: string): Promise<ApiResponse<ClientBalanceDto>> {
        const row = await this.repo.findBalanceById(id);
        if (!row) throw new NotFoundException('Client not found');
        return { data: { clientId: id, balance: row.balance } };
      }
    }
  callouts:
    - line: 3
      text: "DTO de sortie dédié à l'endpoint"
    - line: 12
      text: "Route : GET /clients/:id/soldes"
    - line: 16
      text: "Réponse standard `{ data: ... }`"
  expected_output: "404 si client inconnu, sinon balance"

